services:
  web:
    build: .
    container_name: node-web
    ports:
      - "3001:3000"
    environment:
      - REDIS_HOST=redis
    restart: unless-stopped
    networks:
      - redis-network

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - redis-network

volumes:
  redis-data:
networks:
  redis-network:
